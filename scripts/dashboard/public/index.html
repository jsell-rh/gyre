<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gyre development cockpit</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/dev-app.css">
</head>
<body>
<header class="masthead">
  <span class="brand" data-nav="overview"><span class="gy">◉</span> Gyre · Development cockpit</span>
  <nav class="views" id="nav">
    <button data-nav="overview" class="active">Overview</button>
    <button data-nav="tasks">Tasks</button>
    <button data-nav="dependencies">Dependencies</button>
    <button data-nav="incidents">Events</button>
  </nav>
  <span class="spacer"></span>
  <input id="global-search" type="search" placeholder="Search tasks  ( / )" autocomplete="off">
</header>

<section class="health" id="health" hidden></section>

<main id="main">
  <div id="view-overview" class="view"></div>
  <div id="view-tasks" class="view" hidden></div>
  <div id="view-dependencies" class="view" hidden></div>
  <div id="view-incidents" class="view" hidden></div>
</main>

<div id="drawer-backdrop"></div>
<aside id="drawer" aria-label="Task detail">
  <header>
    <span class="id" id="drawer-id"></span>
    <span class="title" id="drawer-title"></span>
    <span id="drawer-badges"></span>
    <button id="drawer-close" title="Close (Esc)">×</button>
  </header>
  <div class="tabs" id="drawer-tabs">
    <button data-tab="stream" class="on">Agent stream</button>
    <button data-tab="activity">Attempt history</button>
    <button data-tab="raw">Raw log</button>
  </div>
  <div id="stream-controls" class="dev-stream-controls" hidden>
    <span>Events</span>
    <button id="stream-expand" type="button">Expand all</button>
    <button id="stream-collapse" type="button">Collapse all</button>
  </div>
  <div class="body" id="drawer-body"></div>
  <button id="stream-bottom" class="dev-stream-bottom" type="button" hidden>
    ↓ Return to bottom <span id="stream-unread" class="dev-stream-count" hidden></span>
  </button>
</aside>

<div class="kbd-hint">Search tasks · Select a task for attempts and PRs · Esc close</div>

<script type="module" src="/dev-app.js"></script>
</body>
</html>
