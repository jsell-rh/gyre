[package]
name = "gyre-adapters"
description = "Adapter implementations (SQLite, etc.) for the Gyre platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
rusqlite = { workspace = true }
diesel = { workspace = true }
diesel_migrations = { workspace = true }
git2 = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
parking_lot = "0.12"
zstd = { workspace = true }
sha2 = "0.10"
hex = "0.4"
ring = { workspace = true }
futures-util = { workspace = true }
walkdir = { workspace = true }
url = { workspace = true }
# Rust Pass 2 call-graph extraction drives rust-analyzer over LSP
# (specs/system/lsp-call-graph.md §5). syn parses fixture/repo sources for
# fn definitions and extents; proc-macro2's span-locations feature (enabled
# on syn's own proc-macro2 dependency) provides the line/column data those
# extents are read from; lsp-types supplies the LSP request/response type
# definitions.
syn = { workspace = true }
proc-macro2 = { version = "1", features = ["span-locations"] }
lsp-types = "0.97"
gyre-common = { workspace = true }
gyre-domain = { workspace = true }
gyre-ports = { workspace = true }

# LLM inference via Google Vertex AI — direct REST API + ADC auth.
# rig-core ≥ 0.33.0 requires Rust 1.88 (let chains); our MSRV is 1.87.
# We implement the adapter using reqwest + ring (for JWT signing).
reqwest = { workspace = true }
base64 = "0.22"

# SOPS-compatible secret encryption at rest (TASK-273, admin-panel.md /
# platform-model.md §7 Storage Backend: SOPS is the default secret
# backend). `age` is the reference Rust implementation of the age
# encryption spec (age-encryption.org/v1) used to wrap the SOPS data key
# for the configured X25519 identity — the same wrap sops itself stores in
# the `age` metadata array, so stored documents are decryptable with the
# sops CLI given the identity. `aes-gcm` provides AES-256-GCM with the
# 32-byte nonce size sops uses for its ENC[AES256_GCM,...] values (ring's
# AEAD only supports 12-byte nonces). Sync API only; the `async` feature
# is off and armor is all we need from `age`.
age = { version = "0.11", default-features = false, features = ["armor"] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
typenum = "1"

[dev-dependencies]
tempfile = "3"
libsqlite3-sys = { workspace = true }
# Test HTTP server speaking the Vault KV v2 + JWT-auth API subset for the
# Vault secret backend tests.
axum = { workspace = true }
