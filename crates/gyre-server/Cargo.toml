[package]
name = "gyre-server"
description = "HTTP/WebSocket server for the Gyre platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gyre-server"
path = "src/main.rs"

[lib]
name = "gyre_server"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }
prometheus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
tower = { workspace = true, features = ["limit"] }
tower-http = { workspace = true, features = ["cors", "trace", "catch-panic"] }
rust-embed = { workspace = true }
mime_guess = { workspace = true }
futures-util = { workspace = true }
gyre-common = { workspace = true }
gyre-ports = { workspace = true }
gyre-domain = { workspace = true }
gyre-adapters = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
serde_yaml = { workspace = true }
sha2 = "0.10"
hex = { workspace = true }
subtle = { workspace = true }
ring = { workspace = true }
x509-parser = { version = "0.16", features = ["verify"] }
rcgen = { version = "0.13" }
pem = "3.0"
base64 = "0.22"
zstd = { workspace = true }
tempfile = "3"
# OTLP gRPC trace receiver (HSI §3a): tonic gRPC server + generated OTLP proto types.
tonic = { version = "0.12", default-features = false, features = ["transport", "codegen", "prost"] }
opentelemetry-proto = { version = "0.27", default-features = false, features = ["gen-tonic", "trace"] }
tokio-stream = { version = "0.1", features = ["net"] }
parking_lot = "0.12"

[dev-dependencies]
tokio-tungstenite = "0.24"
http = "1"
tower = { workspace = true, features = ["util"] }
tempfile = "3"
reqwest = { workspace = true, features = ["json"] }
# For auth integration tests: seed users/api-keys and hash api keys.
gyre-common = { workspace = true }
gyre-ports = { workspace = true }
gyre-domain = { workspace = true }
sha2 = "0.10"
