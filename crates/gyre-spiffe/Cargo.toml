[package]
name = "gyre-spiffe"
description = "SPIFFE X.509-SVID workload attestation: trust-domain CA, SVID issuance, chain verification, trust bundles (SPIFFE bundle format), and the SPIFFE Workload API client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
rcgen = { version = "0.13", features = ["x509-parser"] }
x509-parser = { version = "0.16", features = ["verify"] }
pem = "3.0"
base64 = "0.22"
hex = { workspace = true }
sha2 = "0.10"
time = { version = "0.3", features = ["parsing"] }
# SPIFFE Workload API (gRPC over UDS) client for externally configured
# SPIRE servers. Same versions as gyre-server's gRPC stack.
tonic = { version = "0.12", default-features = false, features = ["transport", "codegen", "prost"] }
prost = "0.13"
tokio-stream = { version = "0.1", features = ["net"] }
async-trait = { workspace = true }
tower = { workspace = true }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
# PKCS#8 key wrapper type shared with rcgen's key-pair API.
rustls-pki-types = "1.14"
ring = "0.17"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
tempfile = "3"
