name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  dev-controller:
    name: Development controller
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/fullsend-dispatcher/go.mod
          cache-dependency-path: tools/fullsend-dispatcher/go.sum
      - run: go test -race ./...
        working-directory: tools/fullsend-dispatcher
      - run: python3 -m unittest discover -s scripts -p 'test_dev*.py'
      - run: python3 -m unittest discover -s scripts -p 'test_pipeline*.py'
      - run: node --test scripts/dashboard/test/*.test.mjs
      - run: node --test scripts/test/*.test.mjs

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: python3 scripts/check-rustfmt-diff.py HEAD^1

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Rust linker (mold, lld fallback)
        uses: ./.github/actions/setup-linker
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          prefix-key: v0-clippy
      - run: python3 scripts/check-clippy-diff.py HEAD^1

  arch-lint:                                                                                                                                  
    name: Architecture lint                                                                                                                     
    runs-on: ubuntu-latest                                                                                                                      
    steps:                                                                                                                                      
      - uses: actions/checkout@v4                                                                                                               
      - run: bash scripts/check-arch.sh                                                                                                         
      - name: API auth coverage lint (advisory)
        run: bash scripts/check-api-auth.sh || true
      - name: Tenant filter lint (advisory)
        run: bash scripts/check-tenant-filter.sh || true
      - name: Hierarchy lint (M34)
        run: GYRE_CHECK_HIERARCHY=1 bash scripts/check-hierarchy.sh
      - name: Dead parameter lint (advisory)
        run: bash scripts/check-dead-parameters.sh || true
      - name: Byte-slice truncation lint (advisory)
        run: bash scripts/check-byte-slice-truncation.sh || true
      - name: Warn-continue creation lint (advisory)
        run: bash scripts/check-warn-continue-creation.sh || true
      - name: Inert enforcement lint (advisory)
        run: bash scripts/check-inert-enforcement.sh || true
      - name: Ignored tool test lint (advisory)
        run: bash scripts/check-ignored-tool-tests.sh || true
      - name: Id-from-sha lint (advisory)
        run: bash scripts/check-id-from-sha.sh || true
      - name: ABAC-exempt handler authorization lint (advisory)
        run: bash scripts/check-abac-exempt-handlers.sh || true
      - name: Scope-literal defaults lint (advisory)
        run: bash scripts/check-scope-literal-defaults.sh || true
      - name: Unwritten adapter store-field lint (advisory)
        run: bash scripts/check-unwritten-store-fields.sh || true
      - name: In-memory state store lint (advisory)
        run: bash scripts/check-in-memory-state-stores.sh || true
      - name: Unbounded external http lint (advisory)
        run: bash scripts/check-unbounded-external-http.sh || true
      - name: Unwired port-method lint (advisory)
        run: bash scripts/check-unwired-port-methods.sh || true
      - name: Sandbox sweep artifact lint
        run: bash scripts/check-sandbox-sweep-artifacts.sh
      - name: ABAC route registry lint
        run: bash scripts/check-abac-route-registry.sh
      - name: Migration version uniqueness lint
        run: bash scripts/check-migration-versions.sh
      - name: Byte-slice truncation lint
        run: bash scripts/check-byte-slice-truncation.sh
      - name: Dead MessageKind lint
        run: bash scripts/check-dead-message-kinds.sh
      - name: Em-dash check                                                                                                                     
        run: |                                                                                                                                  
          find crates -name '*.rs' -o -name '*.toml' | xargs bash scripts/check-no-em-dash.sh || true  

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust linker (mold, lld fallback)
        uses: ./.github/actions/setup-linker
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          prefix-key: v0-test
      - uses: taiki-e/install-action@nextest
      - name: Install pinned jj (recorded-fixture tests need a real binary)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/jj.tar.gz \
            https://github.com/jj-vcs/jj/releases/download/v0.39.0/jj-v0.39.0-x86_64-unknown-linux-musl.tar.gz
          mkdir -p /tmp/jj-dist
          tar -xzf /tmp/jj.tar.gz -C /tmp/jj-dist
          test -x /tmp/jj-dist/jj
          sudo install -m 755 /tmp/jj-dist/jj /usr/local/bin/jj
          jj --version
          jj --version | grep -q "0.39.0"
      - run: cargo nextest run --all
        env:
          # The jj recorded-fixture tests must execute against the real
          # binary in CI; a missing jj fails them instead of silently
          # skipping with zero assertions (task-106 F-CI).
          GYRE_JJ_TESTS_MUST_RUN: "1"

  web-build:
    name: Web build + bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install Node dependencies
        run: cd web && npm ci
      - name: Build web app
        run: cd web && npm run build
      - name: Run vitest component tests
        run: cd web && npm test

  gyre-agent-tests:
    name: Gyre agent runner tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Zero-dependency: node --test with the real runner against a stubbed
      # SDK (meta-spec prompt delivery) and the cred-proxy suite.
      - name: Run agent runner + cred-proxy tests
        run: cd docker/gyre-agent && npm test

  build-release:
    name: Build (release)
    if: github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust linker (mold, lld fallback)
        uses: ./.github/actions/setup-linker
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          prefix-key: v0-release
      - run: cargo build --release --all
