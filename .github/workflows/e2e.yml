name: E2E Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  e2e:
    # Pinned to ubuntu-24.04: ubuntu-latest now resolves to ubuntu-26.04,
    # where the locked Playwright 1.58.2 cannot install browsers ("Playwright
    # does not support chromium on ubuntu26.04-x64"; ubuntu-26.04 host support
    # first shipped in later Playwright releases — 1.65.0's registry carries a
    # full ubuntu26.04-x64 entry, 1.58.2's stops at ubuntu24.04). Upgrading
    # Playwright would move the bundled chromium from r1208 to r1254 and
    # invalidate the committed visual baselines under
    # web/tests/e2e/explorer-visual.spec.js-snapshots. Stay on ubuntu-24.04
    # (fully supported by 1.58.2) until a Playwright upgrade is deliberately
    # paired with a baseline regeneration.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        run: sudo apt-get install -y mold

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build gyre-server release binary
        run: cargo build --release -p gyre-server

      - name: Install Node dependencies
        run: cd web && npm ci

      - name: Build web app
        run: cd web && npm run build

      - name: Run vitest component tests
        run: cd web && npm test

      - name: Install Playwright browsers
        run: cd web && npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: cd web && npx playwright test
        env:
          GYRE_AUTH_TOKEN: e2e-test-token
          GYRE_PORT: '2222'

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: web/test-results/
