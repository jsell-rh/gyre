name: E2E Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  e2e:
    # Pinned: ubuntu-latest now resolves to ubuntu26.04, which the locked
    # Playwright 1.58.2 does not support ("Playwright does not support
    # chromium on ubuntu26.04-x64" — E2E run 42586542960). Stay on an image
    # whose platform is in Playwright 1.58.2's registry until the toolchain
    # is upgraded to a version with ubuntu26.04 support.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        run: sudo apt-get install -y mold

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build gyre-server release binary
        run: cargo build --release -p gyre-server

      - name: Install Node dependencies
        run: cd web && npm ci

      - name: Build web app
        run: cd web && npm run build

      - name: Run vitest component tests
        run: cd web && npm test

      - name: Install Playwright browsers
        run: cd web && npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: cd web && npx playwright test
        env:
          GYRE_AUTH_TOKEN: e2e-test-token
          GYRE_PORT: '2222'

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: web/test-results/
