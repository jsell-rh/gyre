version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  cargo:
    endpoints:
      - {host: index.crates.io, port: 443, protocol: rest, access: read-only, enforcement: enforce}
      - {host: static.crates.io, port: 443, protocol: rest, access: read-only, enforcement: enforce}
      - {host: crates.io, port: 443, protocol: rest, access: read-only, enforcement: enforce}
    binaries:
      - {path: /usr/local/cargo/bin/cargo}
      - {path: /usr/local/rustup/toolchains/**/bin/cargo}
      - {path: /usr/local/rustup/toolchains/**/bin/rustc}
  npm:
    endpoints:
      - {host: registry.npmjs.org, port: 443, protocol: rest, access: read-only, enforcement: enforce, allow_encoded_slash: true}
    binaries:
      - {path: /usr/bin/node}
      - {path: /usr/local/bin/node}
